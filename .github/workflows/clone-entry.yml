name: Clone entry

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string
      dry_run:
        description: Show the diff only; do not push or deploy
        required: false
        type: boolean
        default: false

permissions: {}

# One content writer at a time. GitHub keeps a single pending run per group, so a third
# simultaneous request replaces the second; traffic is low enough to accept that.
concurrency:
  group: content-writes
  cancel-in-progress: false

jobs:
  run:
    # workflow_dispatch can target any ref; only main may write content.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Workflow-only dependencies (yaml, sharp); the install step never sees the write token.
      - name: Install workflow dependencies
        run: pnpm --dir .github/scripts install --frozen-lockfile
      - name: Create draft and push
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ inputs.payload }}
          DRY_RUN: ${{ inputs.dry_run }}
          STAGE_PATHS: src/content
        run: bash .github/scripts/commit-loop.sh .github/scripts/clone-entry.mjs
